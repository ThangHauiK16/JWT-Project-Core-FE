<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Bán Hàng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <style>
        body {
            background-color: #f8f9fa;
        }
        .header {
            background-color: #dc3545;
            padding: 10px 20px;
        }
        .header img {
            height: 60px;
        }
        #Logout {
            color: #fff;
            font-weight: bold;
            padding: 8px 16px;
            border: 2px solid #fff;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        #Logout:hover {
            background-color: #fff;
            color: #dc3545;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row align-items-center header">
            <div class="col-md-6 d-flex align-items-center">
                <img src="img/Logo_Sach.png" alt="Logo">
                <h3 class="text-white ms-3 mb-0">Web Sách Demo Với JWT</h3>
            </div>
            <div class="col-md-6 text-end">
                <a id="Logout" href="#" class="text-decoration-none">Logout</a>
            </div>
        </div>
        <div class=" mt-4">
            <div class="row">
                <div class="col-md-2">
                    <h5 class="text-center fw-semibold">Thể Loại</h5>
                    <ul class="list-group" id="categoryList">
                        
                    </ul>
                </div>

                <div class="col-md-10">
                    <div class="row" id="bookContainer">
                    
                    </div>

                
                    <nav aria-label="Page navigation example">
                        <ul class="pagination justify-content-center mt-3" id="pagination">
                        
                        </ul>
                    </nav>
                </div>
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Customer.js"></script>
</body>
</html>
