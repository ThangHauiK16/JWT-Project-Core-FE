<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Bán Hàng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <style>
        body {
            background-color: #f8f9fa;
        }
        .header {
            background-color: #dc3545;
            padding: 10px 20px;
        }
        .header img {
            height: 60px;
        }
        #Logout {
            color: #fff;
            font-weight: bold;
            padding: 8px 16px;
            border: 2px solid #fff;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        #Logout:hover {
            background-color: #fff;
            color: #dc3545;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row align-items-center header">
            <div class="col-md-6 d-flex align-items-center">
                <img src="img/Logo_Sach.png" alt="Logo">
                <h3 class="text-white ms-3 mb-0">Web Sách Demo Với JWT</h3>
            </div>
            <div class="col-md-6 text-end">
                <a id="Logout" href="#" class="text-decoration-none">Logout</a>
            </div>
        </div>
        <div class=" mt-4">
            <div class="row">
                <div class="col-md-2">
                    <h5 class="text-center fw-semibold">Thể Loại</h5>
                    <ul class="list-group" id="categoryList">
                        
                    </ul>
                </div>

                <div class="col-md-10">
                    <div class="row" id="bookContainer">
                    
                    </div>

                
                    <nav aria-label="Page navigation example">
                        <ul class="pagination justify-content-center mt-3" id="pagination">
                        
                        </ul>
                    </nav>
                </div>
            </div>
        </div>

    </div>

    <div class="modal fade" id="OrderModalCustomer" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-md">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Chi Tiết Đơn Hàng</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="orderFormCustomer">
                        <div class="mb-3">
                            <label class="form-label">Tên Sách:</label>
                            <p id="orderBookName"></p>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Giá:</label>
                            <p id="orderBookPrice" class="text-danger"></p>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Số lượng:</label>
                            <input type="number" id="orderBookQuantity" class="form-control" value="1" min="1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tổng tiền:</label>
                            <p id="orderTotalPrice" class="text-success"></p>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" id="payOrderBtn">Thanh toán</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
   
    <script src="Customer.js"></script>
   
</body>
</html>
