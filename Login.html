<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>
    <div class="d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="container rounded-2 shadow" style="background-color: rgb(136, 229, 128)">
            <div id="loginDiv">
                <h3 class="text-center pt-2 text-success fs-2 fw-semibold">Login</h3>
                <div class="pt-5 pb-2 text-center">
                    <input id="loginUsername" placeholder="Username" class="w-75 rounded-1 border-0 mb-3"
                        style="height: 2rem" />
                    <input id="loginPassword" type="password" placeholder="Password"
                        class="w-75 rounded-1 border-0 mb-2" style="height: 2rem" />
                </div>
                <div class="text-center pb-3">
                    <button id="loginBtn" class="btn btn-primary mb-2">Login</button>
                    <button id="showRegister" class="btn btn-secondary mb-2">
                        Register
                    </button>
                </div>
            </div>
            <div id="registerDiv" style="display: none">
                <h3>Register</h3>
                <div id="userNameError" class="text-danger mb-2" style="font-size: 0.9em"></div>
                <input id="regUsername" placeholder="Username" class="form-control mb-2" />
                <div id="userPasswordError" class="text-danger mb-2" style="font-size: 0.9em"></div>
                <input id="regPassword" type="password" placeholder="Password" class="form-control mb-2" />
                <div id="userRoleError" class="text-danger mb-2" style="font-size: 0.9em"></div>
                <input id="regRole" placeholder="Role" class="form-control mb-2" />
                <button id="registerBtn" class="btn btn-success mb-2">
                    Register
                </button>
                <button id="backLogin" class="btn btn-secondary mb-2">
                    Back to Login
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Login.js"></script>
</body>

</html>
