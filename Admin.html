<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <style>
        body {
            overflow-x: hidden;
        }

        #sidebar {
            width: 20%;
            min-width: 200px;
            background-color: #f8f9fa;
            height: 100vh;
        }
        #sidebar .list-group-item,
        .offcanvas-body .list-group-item {
            cursor: pointer;
        }
        #content {
            width: 80%;
            padding: 20px;
        }

        #main-container {
            display: flex;
        }
      

        
    </style>
</head>

<body>
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasMenu" aria-labelledby="offcanvasMenuLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasMenuLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="list-group">
                <li class="list-group-item" onclick="showModule('books')">
                    Quản lý sách
                </li>
                <li class="list-group-item" onclick="showModule('orders')">
                    Quản lý hóa đơn
                </li>
            </ul>
        </div>
    </div>

    <button class="btn btn-primary m-2 d-md-none" type="button" data-bs-toggle="offcanvas"
        data-bs-target="#offcanvasMenu">
        ☰ Menu
    </button>

    <div id="main-container">
        <div id="sidebar" class="d-none d-md-block">
            <ul class="list-group list-group-flush">
                <li class="list-group-item "  onclick="showModule('books')">
                    Quản lý sách
                </li>  
                <li class="list-group-item" onclick="showModule('orders')">
                    Quản lý hóa đơn
                </li>
            </ul>
        </div>

        <div id="content">

            <div>
              
                    <div id="booksModule">
                        <div class="d-flex justify-content-between">
                            <h2>Quản lý sách</h2>
                            <button id="Logout" class="btn btn-warning mb-2">Logout</button>
                        </div>
                        <div class="d-flex justify-content-between">
                            <button id="addBookBtn" class="btn btn-success mb-2">Add Book</button>
                            <div class="input-group input-group-sm mb-2" style="max-width: 350px;">
                                <input type="text" id="textSearchBook" class="form-control" placeholder="Nhập tên sách">
                                <button class="btn btn-outline-secondary" type="button" id="searchBook">Search</button>
                            </div>
                        </div>
                      
                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th>STT</th>
                                    <th>Name</th>
                                    <th>Genre</th>
                                    <th>Image</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="BookTable"></tbody>
                        </table>
                        <nav class="mt-3">
                            <ul class="pagination justify-content-center" id="bookPagination"></ul>
                        </nav>

                    </div>

                    <div id="ordersModule" style="display: none">
                        <div class="d-flex justify-content-between">
                            <h2>Quản lý hóa đơn</h2>
                            <button id="Logout2" class="btn btn-warning mb-2">Logout</button>
                        </div>
                        <div class="d-flex justify-content-between">
                           <button id="addOrderBtn" class="btn btn-success mb-2">  Add Order</button>
                           <div class="input-group input-group-sm mb-2" style="max-width: 350px;">
                                <input type="text" id="textSearchOrder" class="form-control" placeholder="Nhập tên sách">
                                <button class="btn btn-outline-secondary" type="button" id="searchOrder">Search</button>
                            </div>
                        </div>
                        
                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th>STT</th>
                                    <th>Ma Hoa Don</th>
                                    <th>Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="OrderTable"></tbody>
                        </table>
                         <nav class="mt-3">
                            <ul class="pagination justify-content-center" id="orderPagination"></ul>
                        </nav>

                    </div>
                
                
            </div>
           
        </div>
    </div>
<!-- Modal Book -->
    <div class="modal fade" id="BookModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Thêm / Cập nhật sách</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="bookForm">
                        <div class="row">
                            <div class="col-6">
                                <div class="mb-3">
                                    <label class="form-label">Mã sách</label>
                                    <input type="text" class="form-control" name="MaSach" required maxlength="50" />
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Tên sách</label>
                                    <input type="text" class="form-control" name="TenSach" required maxlength="200" />
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Thể loại</label>
                                    <input type="text" class="form-control" name="TheLoai" maxlength="100" />
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="mb-3">
                                    <label class="form-label">Giá nhập</label>
                                    <input type="number" class="form-control" name="GiaNhap" min="0" />
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Giá bán</label>
                                    <input type="number" class="form-control" name="GiaBan" min="0" />
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Tên tác giả</label>
                                    <input type="text" class="form-control" name="TenTacGia" maxlength="100" />
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nội dung sách</label>
                            <textarea class="form-control" name="NoiDungSach" maxlength="2000"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Chọn hình ảnh</label>
                            <input type="file" class="form-control" id="imageInput" name="ImageFile" accept="image/*" />

                            <div class="mt-3">
                                <img id="previewImage" src="#" alt="Preview" style="
                                    max-width: 200px;
                                    display: none;
                                    border: 1px solid #ccc;
                                    padding: 5px;
                                    " />
                            </div>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Đóng
                    </button>
                    <button type="button" class="btn btn-primary" id="modalSaveBtn">
                        Lưu
                    </button>
                </div>
            </div>
        </div>
    </div>
<!-- Modal Order -->
    <div class="modal fade" id="OrderModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitleOrder">
                        Thêm / Cập Đơn Hàng
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="OrderForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Ngày Tạo</label>
                            <input type="datetime-local" class="form-control" name="NgayTao" required />
                        </div>

                        <div class="mb-3">
                            <label class="fw-bold">Danh sách Sản phẩm</label>
                            <div id="orderDetailsContainer"></div>
                            <button type="button" class="btn btn-sm btn-info mt-2" id="addBookToOrderBtn">
                                Thêm Sách
                            </button>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Đóng
                    </button>
                    <button type="button" class="btn btn-primary" id="modalSaveOrderBtn">
                        Lưu
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="DetailModal" tabindex="-1" aria-labelledby="detailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="detailModalLabel">Chi Tiết</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="detailModalBody"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Admin.js"></script>
</body>

</html>
